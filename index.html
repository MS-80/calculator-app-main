<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | Calculator app</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="themes.css">

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 11px;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>
  <div class="calculator">
    <div class="header">
      <span class="title">calc</span>
      <div class="theme-switch">
        <span>THEME</span>
        <div class="toggle">
          <input type="radio" name="theme" id="theme1" checked>
          <label for="theme1"></label>
          <input type="radio" name="theme" id="theme2">
          <label for="theme2"></label>
          <input type="radio" name="theme" id="theme3">
          <label for="theme3"></label>
        </div>
      </div>
    </div>
    <div class="display">00</div>
    <div class="buttons">
      <button class="key">7</button>
      <button class="key">8</button>
      <button class="key">9</button>
      <button class="key del">DEL</button>
      <button class="key">4</button>
      <button class="key">5</button>
      <button class="key">6</button>
      <button class="key">+</button>
      <button class="key">1</button>
      <button class="key">2</button>
      <button class="key">3</button>
      <button class="key">-</button>
      <button class="key">.</button>
      <button class="key">0</button>
      <button class="key">/</button>
      <button class="key">x</button>
      <button class="key reset">RESET</button>
      <button class="key equal">=</button>
    </div>
  </div>
  <!-- <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </div> -->

  <script src="script.js"></script>
  <script src="app.js"></script>
</body>

</html>
